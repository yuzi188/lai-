<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>老王新加坡海南雞飯｜官方訂餐</title>
  <meta name="description" content="老王新加坡海南雞飯官方訂餐網站，提供白雞、燒雞、雞飯、河粉與小菜線上訂購。">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;700;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="os-design.css">
</head>
<body class="hainan-body">
  <header class="hainan-nav">
    <a class="hainan-brand" href="hainan.html" aria-label="老王新加坡海南雞飯首頁">
      <span>老王</span>
      <strong>新加坡海南雞飯</strong>
    </a>
    <nav aria-label="海南雞飯網站導覽">
      <a href="#menu">菜單</a>
      <a href="#order">線上訂餐</a>
      <a href="hainan-admin.html">接單後台</a>
    </nav>
  </header>

  <main class="hainan-launch">
    <section id="order" class="hainan-command-screen">
      <div class="hainan-hero-copy hainan-command-copy">
        <p>Singapore Hainanese Chicken Rice</p>
        <h1>老王新加坡海南雞飯</h1>
        <span>用手機完成點餐、忌口過敏備註與訂單追蹤。海南雞飯接單後台會同步看到新單。</span>
        <div class="hainan-actions">
          <a href="#order">開始訂餐</a>
          <a href="#order">填寫資料</a>
          <a href="#menu">查看菜單</a>
        </div>
        <div class="hainan-live-strip" aria-label="服務狀態">
          <strong>10:30-20:30</strong>
          <span>內用 / 自取 / 外送</span>
          <span>多語 AI 點餐</span>
        </div>
      </div>

      <section id="menu" class="hainan-command-stage" aria-label="招牌菜單">
        <aside class="hainan-menu-reference">
          <img src="assets/hainan-ai/hero-hainan-ai.png" alt="老王新加坡海南雞飯招牌餐點">
          <div>
            <strong>一張圖點出招牌</strong>
            <span>白雞、燒雞、雞飯與醬料是第一眼記憶點。</span>
          </div>
        </aside>
        <div class="hainan-section-head hainan-menu-head">
          <p>MENU</p>
          <h2>招牌菜單</h2>
          <span>全部菜色照片同屏顯示，點照片或加入直接進右側訂單。</span>
        </div>
        <div id="hainanMenuGrid" class="hainan-menu-grid"></div>
      </section>

      <section class="hainan-command-order" aria-label="AI 點餐與訂單">
        <div class="hainan-order-panel">
          <div>
            <p class="hainan-kicker">ORDER</p>
            <h2>偏好與訂購資料</h2>
          </div>
          <div class="hainan-ai-grid">
            <label>語言
              <select id="hainanLanguage">
                <option value="zh-TW">中文</option>
                <option value="km">高棉文</option>
                <option value="vi">越南文</option>
                <option value="en">English</option>
                <option value="th">泰文</option>
              </select>
            </label>
            <label>預算
              <input id="hainanBudget" type="number" min="0" step="0.5" value="6">
            </label>
            <label>桌號
              <input id="hainanTableCode" type="text" value="A03">
            </label>
          </div>
          <div class="hainan-preference-row">
            <label><input type="checkbox" name="hainanAvoid" value="beef">不吃牛</label>
            <label><input type="checkbox" name="hainanAvoid" value="pork">不吃豬</label>
            <label><input type="checkbox" name="hainanAvoid" value="seafood">不吃海鮮</label>
            <label><input type="checkbox" name="hainanAvoid" value="spicy">不要辣</label>
            <label><input type="checkbox" name="hainanAllergy" value="egg">蛋過敏</label>
            <label><input type="checkbox" name="hainanAllergy" value="soy">大豆過敏</label>
            <label><input type="checkbox" name="hainanAllergy" value="sesame">芝麻過敏</label>
          </div>
          <div id="hainanAiNotice" class="hainan-ai-notice">AI 菜單載入中...</div>
          <div class="hainan-cart-actions hainan-ai-actions">
            <button id="hainanRecommend" type="button">AI 推薦</button>
            <button id="hainanReloadMenu" type="button">更新菜單</button>
          </div>
          <div id="hainanRecommendations" class="hainan-recommendations"></div>
          <div class="hainan-form-grid">
            <label>姓名
              <input id="hainanCustomerName" type="text" placeholder="例如：王小姐">
            </label>
            <label>電話
              <input id="hainanCustomerPhone" type="tel" placeholder="例如：0912-345-678">
            </label>
            <label>取餐方式
              <select id="hainanPickupType">
                <option value="自取">自取</option>
                <option value="外送">外送</option>
                <option value="團體訂購">團體訂購</option>
              </select>
            </label>
            <label>取餐時間
              <input id="hainanPickupTime" type="datetime-local">
            </label>
            <label class="hainan-full">備註
              <textarea id="hainanOrderNote" rows="3" placeholder="例如：不要辣、飯少、醬另外放"></textarea>
            </label>
          </div>
        </div>

        <aside class="hainan-cart">
          <div class="hainan-cart-head">
            <div>
              <p class="hainan-kicker">CURRENT ORDER</p>
              <h2>訂單明細</h2>
            </div>
            <strong id="hainanTotal">$0</strong>
          </div>
          <div id="hainanCartItems" class="hainan-cart-items">
            <p>尚未加入餐點</p>
          </div>
          <div id="hainanUpsells" class="hainan-upsells"></div>
          <div class="hainan-cart-actions">
            <button id="hainanClearCart" type="button">清空</button>
            <button id="hainanSubmitOrder" type="button">送出訂單</button>
          </div>
        </aside>
      </section>
    </section>
  </main>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="hainan.js"></script>
</body>
</html>
