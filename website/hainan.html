<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>老王新加坡海南雞飯｜官方訂餐</title>
  <meta name="description" content="老王新加坡海南雞飯官方訂餐網站，提供白雞、燒雞、雞飯、河粉與小菜線上訂購。">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;700;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="os-design.css">
</head>
<body class="hainan-body hainan-shop-body">
  <main id="order" class="hainan-shop-app">
    <section class="hainan-shop-hero" aria-label="店家資訊">
      <div class="hainan-shop-cover">
        <img src="assets/hainan-ai/hero-hainan-ai.png" alt="老王新加坡海南雞飯餐點拼盤">
        <div class="hainan-shop-controls" aria-label="頁面操作">
          <a href="hainan.html" aria-label="返回">‹</a>
          <a href="#menu" aria-label="搜尋">⌕</a>
          <a href="hainan-admin.html" aria-label="接單後台">後台</a>
        </div>
      </div>
      <div class="hainan-shop-profile">
        <div>
          <h1>老王新加坡海南雞飯</h1>
          <p><strong>4.8 分</strong><span>25-35 分鐘</span><span>1.2km</span></p>
          <small>公告：白雞、燒雞、雞飯、河粉現點現做。</small>
          <div class="hainan-promo-row">
            <span>滿 $25，3.5 公里內免配送費</span>
            <span>首單立減 $0.1</span>
          </div>
        </div>
        <img src="assets/hainan-menu-reference.jpg" alt="老王海南雞飯菜單">
      </div>
    </section>

    <nav class="hainan-shop-tabs" aria-label="店家分頁">
      <a class="active" href="#menu">商品</a>
      <a href="#reviews">評價 649</a>
      <a href="#merchant">商家</a>
      <button type="button">好友拼單</button>
    </nav>

    <section id="menu" class="hainan-shop-layout" aria-label="線上點餐">
      <aside id="hainanCategoryList" class="hainan-category-rail" aria-label="商品分類">
        <button class="active" type="button">全部</button>
      </aside>

      <section class="hainan-products">
        <div class="hainan-shop-section-title">
          <small>Promotion 2.68$</small>
          <strong>今日推薦</strong>
        </div>
        <div id="hainanMenuGrid" class="hainan-menu-grid"></div>
      </section>

      <aside id="hainanCartPanel" class="hainan-cart">
        <div class="hainan-cart-head">
          <div>
            <p class="hainan-kicker">CURRENT ORDER</p>
            <h2>訂單明細</h2>
          </div>
          <strong id="hainanTotal">$0</strong>
        </div>
        <div id="hainanCartItems" class="hainan-cart-items">
          <p>尚未加入餐點</p>
        </div>
        <div id="hainanUpsells" class="hainan-upsells"></div>
        <div class="hainan-order-panel">
          <div>
            <p class="hainan-kicker">CUSTOMER</p>
            <h2>取餐資料</h2>
          </div>
          <div class="hainan-ai-grid">
            <label>語言
              <select id="hainanLanguage">
                <option value="zh-TW">中文</option>
                <option value="km">高棉文</option>
                <option value="vi">越南文</option>
                <option value="en">English</option>
                <option value="th">泰文</option>
              </select>
            </label>
            <label>預算
              <input id="hainanBudget" type="number" min="0" step="0.5" value="6">
            </label>
            <label>桌號
              <input id="hainanTableCode" type="text" value="A03">
            </label>
          </div>
          <div class="hainan-preference-row" aria-label="忌口與過敏">
            <label><input type="checkbox" name="hainanAvoid" value="beef">不吃牛</label>
            <label><input type="checkbox" name="hainanAvoid" value="pork">不吃豬</label>
            <label><input type="checkbox" name="hainanAvoid" value="seafood">不吃海鮮</label>
            <label><input type="checkbox" name="hainanAvoid" value="spicy">不要辣</label>
            <label><input type="checkbox" name="hainanAllergy" value="egg">蛋過敏</label>
            <label><input type="checkbox" name="hainanAllergy" value="soy">大豆過敏</label>
            <label><input type="checkbox" name="hainanAllergy" value="sesame">芝麻過敏</label>
          </div>
          <div id="hainanAiNotice" class="hainan-ai-notice">菜單載入中...</div>
          <div class="hainan-cart-actions hainan-ai-actions">
            <button id="hainanRecommend" type="button">推薦餐點</button>
            <button id="hainanReloadMenu" type="button">更新菜單</button>
          </div>
          <div id="hainanRecommendations" class="hainan-recommendations"></div>
          <div class="hainan-form-grid">
            <label>姓名
              <input id="hainanCustomerName" type="text" placeholder="例如：王小姐">
            </label>
            <label>電話
              <input id="hainanCustomerPhone" type="tel" placeholder="例如：0912-345-678">
            </label>
            <label>取餐方式
              <select id="hainanPickupType">
                <option value="自取">自取</option>
                <option value="外送">外送</option>
                <option value="團體訂購">團體訂購</option>
              </select>
            </label>
            <label>取餐時間
              <input id="hainanPickupTime" type="datetime-local">
            </label>
            <label class="hainan-full">備註
              <textarea id="hainanOrderNote" rows="3" placeholder="例如：不要辣、飯少、醬另外放"></textarea>
            </label>
          </div>
          <div class="hainan-cart-actions">
            <button id="hainanClearCart" type="button">清空</button>
            <button id="hainanSubmitOrder" type="button">送出訂單</button>
          </div>
        </div>
      </aside>
    </section>

    <section id="reviews" class="hainan-shop-info">
      <h2>評價</h2>
      <p>白雞腿飯很嫩、雞油飯香，辣椒醬和薑蓉適合分開附。</p>
    </section>
    <section id="merchant" class="hainan-shop-info">
      <h2>商家資訊</h2>
      <p>營業時間 10:30-20:30，支援內用、自取、外送與團體訂購。</p>
    </section>
  </main>

  <div class="hainan-floating-cart" aria-label="固定結帳列">
    <div>
      <strong id="hainanCartCount">0 份</strong>
      <span id="hainanCartFee">預估配送費 $1.00</span>
    </div>
    <a href="#hainanCartPanel">查看訂單</a>
  </div>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="hainan.js"></script>
</body>
</html>
