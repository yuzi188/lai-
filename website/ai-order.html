<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI 掃碼點餐｜LAI家便當</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="os-design.css">
</head>
<body class="ai-os-body">
  <header class="site-header">
    <a class="brand" href="index.html" aria-label="LAI家便當首頁">
      <img src="assets/lai-brand-logo.svg" alt="LAI家便當">
    </a>
    <nav class="nav" aria-label="網站導覽">
      <a href="menu.html">健康輕食</a>
      <a href="classic.html">經典台味</a>
      <a href="group.html">團訂</a>
      <a class="active" href="ai-order.html">AI 點餐</a>
      <a href="order.html">訂購專區</a>
    </nav>
    <a class="header-action" href="ai-order.html">掃碼點餐</a>
  </header>

  <main class="ai-os-shell">
    <section class="ai-os-hero ai-os-customer-hero">
      <div>
        <p class="eyebrow">AI MENU</p>
        <h1>掃碼、推薦、送單一次完成</h1>
        <p>客人選語言、輸入桌號與忌口，系統用規則型 AI 先推薦可賣餐點與加購品，再把清楚備註送到前台與後廚。</p>
      </div>
      <div class="ai-os-qr-card" aria-label="店內 QR 模擬">
        <span></span><span></span><span></span><span></span>
        <strong>TABLE QR</strong>
        <small id="qrHint">A03</small>
      </div>
    </section>

    <section class="ai-os-grid ai-os-order-layout">
      <form id="aiOrderForm" class="ai-os-panel">
        <div class="ai-os-panel-head">
          <div>
            <p class="eyebrow">STEP 1</p>
            <h2>客人資料</h2>
          </div>
          <span id="sourceBadge">QR</span>
        </div>
        <label>語言
          <select id="language">
            <option value="zh-TW">中文</option>
            <option value="km">高棉文</option>
            <option value="vi">越南文</option>
            <option value="en">English</option>
            <option value="th">泰文</option>
          </select>
        </label>
        <div class="ai-os-two">
          <label>桌號 / 取餐碼
            <input id="tableCode" type="text" value="A03" required>
          </label>
          <label>用餐方式
            <select id="pickupType">
              <option value="內用">內用</option>
              <option value="自取">自取</option>
              <option value="外帶">外帶</option>
            </select>
          </label>
        </div>
        <div class="ai-os-two">
          <label>姓名
            <input id="customerName" type="text" value="現場客">
          </label>
          <label>手機
            <input id="customerPhone" type="tel" placeholder="可不填">
          </label>
        </div>
        <label>預算
          <input id="budget" type="number" min="0" step="1" value="160">
        </label>
        <fieldset class="ai-os-checks">
          <legend>忌口</legend>
          <label><input type="checkbox" name="avoid" value="beef">不吃牛</label>
          <label><input type="checkbox" name="avoid" value="pork">不吃豬</label>
          <label><input type="checkbox" name="avoid" value="seafood">不吃海鮮</label>
          <label><input type="checkbox" name="avoid" value="spicy">不要辣</label>
          <label><input type="checkbox" name="avoid" value="vegetarian">素食</label>
        </fieldset>
        <fieldset class="ai-os-checks">
          <legend>過敏</legend>
          <label><input type="checkbox" name="allergy" value="egg">蛋</label>
          <label><input type="checkbox" name="allergy" value="peanut">花生</label>
          <label><input type="checkbox" name="allergy" value="dairy">奶類</label>
          <label><input type="checkbox" name="allergy" value="soy">大豆</label>
        </fieldset>
        <label>備註
          <textarea id="orderNote" rows="3" placeholder="例如：不加蔥、飯少、醬另外放"></textarea>
        </label>
        <button class="primary-print" type="button" id="recommendButton">AI 推薦餐點</button>
      </form>

      <section class="ai-os-panel">
        <div class="ai-os-panel-head">
          <div>
            <p class="eyebrow">STEP 2</p>
            <h2>推薦與菜單</h2>
          </div>
          <button type="button" class="ghost-ops-button" id="reloadMenuButton">更新</button>
        </div>
        <div id="aiNotice" class="ai-os-notice">正在載入菜單...</div>
        <div id="recommendations" class="ai-os-stack"></div>
        <div class="ai-os-divider"></div>
        <div id="menuList" class="ai-os-menu-list"></div>
      </section>

      <section class="ai-os-panel ai-os-cart-panel">
        <div class="ai-os-panel-head">
          <div>
            <p class="eyebrow">STEP 3</p>
            <h2>確認訂單</h2>
          </div>
          <strong id="cartTotal">$0</strong>
        </div>
        <div id="cartList" class="ai-os-stack"></div>
        <div id="upsells" class="ai-os-stack"></div>
        <div class="ai-os-actions">
          <button type="button" class="secondary-print" id="clearCartButton">清空</button>
          <button type="button" class="primary-print" id="submitOrderButton">送出到前台</button>
        </div>
      </section>
    </section>
  </main>

  <script src="ai-order.js"></script>
</body>
</html>
